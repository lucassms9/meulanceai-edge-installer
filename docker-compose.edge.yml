# docker-compose usado no hardware do cliente (edge)
# O arquivo .env fica em /opt/meulanceai/.env — nunca sobrescrito por updates

services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.5
    container_name: mediamtx-edge
    restart: always
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    expose:
      - "8554"                         # RTSP relay interno para FFmpeg/IA
      - "8888"                         # HLS interno (acessado apenas pelo Edge)
      - "9997"                         # Control API interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network

  nginx:
    image: nginx:alpine
    container_name: nginx-edge
    restart: always
    ports:
      - "80:80"                        # HTTP para ESP32 chamar meulanceai.local
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - meulanceai-edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network

  redis:
    image: redis:7-alpine
    container_name: redis-edge
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network
    # Redis só acessível internamente (sem expor porta no host)

  camera-director-ai:
    image: lucassms9/meulanceai-camera-director:${EDGE_IMAGE_TAG:-latest}
    container_name: camera-director-ai
    restart: always
    environment:
      - DIRECTOR_AI_DETECTOR=${DIRECTOR_AI_DETECTOR:-motion}
      - DIRECTOR_AI_MODEL_VERSION=${DIRECTOR_AI_MODEL_VERSION:-motion-shadow-v1}
      - DIRECTOR_AI_MODEL_PATH=${DIRECTOR_AI_MODEL_PATH:-}
      - DIRECTOR_AI_CONFIDENCE=${DIRECTOR_AI_CONFIDENCE:-0.25}
      - DIRECTOR_AI_CLASS_ID=${DIRECTOR_AI_CLASS_ID:-32}
      - DIRECTOR_AI_SAMPLE_FPS=${DIRECTOR_AI_SAMPLE_FPS:-5}
      - DIRECTOR_AI_SAMPLE_SECONDS=${DIRECTOR_AI_SAMPLE_SECONDS:-2}
    volumes:
      - buffer_data:/buffer:ro
      - director_models:/models:ro
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - edge-network

  meulanceai-edge:
    image: lucassms9/meulanceai-edge:${EDGE_IMAGE_TAG:-latest}
    container_name: meulanceai-edge
    restart: always
    env_file:
      - /opt/meulanceai/.env          # único por cliente, persiste entre updates
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # O sidecar lê o mesmo volume neste caminho. Sobrescreve instalações
      # antigas que ainda possuem BUFFER_DIR=/home/ubuntu/buffer no .env.
      - BUFFER_DIR=/buffer
      - MEDIAMTX_HLS_URL=http://mediamtx:8888
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_RTSP_URL=${MEDIAMTX_RTSP_URL:-rtsp://mediamtx:8554}
      - MEDIAMTX_STREAM_PROXY_ENABLED=${MEDIAMTX_STREAM_PROXY_ENABLED:-true}
      - DIRECTOR_AI_URL=http://camera-director-ai:8090
    volumes:
      - buffer_data:/buffer            # buffer FFmpeg — sobrevive a restarts
      - hls_data:/hls                  # segmentos HLS streaming ao vivo
    expose:
      - "3000"                         # porta interna (não exposta no host, apenas nginx acessa)
    depends_on:
      - redis
      - mediamtx
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - edge-network

  edge-auto-updater:
    image: lucassms9/meulanceai-edge-updater:latest
    container_name: edge-auto-updater
    restart: always
    env_file:
      - /opt/meulanceai/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/meulanceai:/opt/meulanceai:ro
      - updater_logs:/var/log
    environment:
      - TZ=America/Sao_Paulo
      - DOCKER_USERNAME=${DOCKER_USERNAME:-}
      - DOCKER_PASSWORD=${DOCKER_PASSWORD:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network

networks:
  edge-network:
    driver: bridge

volumes:
  buffer_data:
  hls_data:
  redis_data:
  updater_logs:
  director_models:
