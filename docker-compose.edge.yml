# docker-compose usado no hardware do cliente (edge)
# O arquivo .env fica em /opt/meulanceai/.env — nunca sobrescrito por updates

services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.5
    container_name: mediamtx-edge
    restart: always
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    expose:
      - "8888"                         # HLS interno (acessado apenas pelo Edge)
      - "9997"                         # Control API interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network

  nginx:
    image: nginx:alpine
    container_name: nginx-edge
    restart: always
    ports:
      - "80:80"                        # HTTP para ESP32 chamar meulanceai.local
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - meulanceai-edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network

  redis:
    image: redis:7-alpine
    container_name: redis-edge
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network
    # Redis só acessível internamente (sem expor porta no host)

  meulanceai-edge:
    image: lucassms9/meulanceai-edge:${EDGE_IMAGE_TAG:-latest}
    container_name: meulanceai-edge
    restart: always
    env_file:
      - /opt/meulanceai/.env          # único por cliente, persiste entre updates
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MEDIAMTX_HLS_URL=http://mediamtx:8888
      - MEDIAMTX_API_URL=http://mediamtx:9997
    volumes:
      - buffer_data:/buffer            # buffer FFmpeg — sobrevive a restarts
      - hls_data:/hls                  # segmentos HLS streaming ao vivo
    expose:
      - "3000"                         # porta interna (não exposta no host, apenas nginx acessa)
    depends_on:
      - redis
      - mediamtx
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - edge-network

  edge-auto-updater:
    image: lucassms9/meulanceai-edge-updater:latest
    container_name: edge-auto-updater
    restart: always
    env_file:
      - /opt/meulanceai/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/meulanceai:/opt/meulanceai:ro
      - updater_logs:/var/log
    environment:
      - TZ=America/Sao_Paulo
      - DOCKER_USERNAME=${DOCKER_USERNAME:-}
      - DOCKER_PASSWORD=${DOCKER_PASSWORD:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge-network

networks:
  edge-network:
    driver: bridge

volumes:
  buffer_data:
  hls_data:
  redis_data:
  updater_logs:
